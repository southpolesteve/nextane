name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run test:package
      - run: npm run test:example

  publish:
    name: Publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install current npm
        run: npm install --global npm@11.18.0
      - run: npm ci
      - name: Check for an existing release
        id: existing
        run: |
          tag="$(git tag --points-at HEAD --list 'v*' | head -n 1)"
          if [ -n "$tag" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Commit is already released as $tag"
          fi
      - name: Choose patch version
        if: steps.existing.outputs.skip != 'true'
        id: version
        run: |
          current="$(node -p "require('./package.json').version")"
          published="$(npm view nextane version)"
          version="$(node scripts/next-release-version.mjs "$current" "$published")"
          npm version "$version" --no-git-tag-version --allow-same-version
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish to npm
        if: steps.existing.outputs.skip != 'true'
        run: npm publish
      - name: Commit version and tag release
        if: steps.existing.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Release v${VERSION} [skip ci]"
          fi
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin HEAD:main "v${VERSION}"
